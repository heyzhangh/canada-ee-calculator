async function unlock() {
  const pwEl = document.getElementById('pw');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('go');
  const pw = pwEl.value;
  if (!pw) { errEl.textContent = '请先输入口令。'; pwEl.focus(); return; }
  btn.disabled = true; errEl.textContent = '正在解密…';
  try {
    const enc = new TextEncoder();
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const salt = b64(ENC.salt), iv = b64(ENC.iv), ct = b64(ENC.ciphertext);
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: ENC.iterations, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) {
    errEl.textContent = '口令不对，请重试。';
    pwEl.value = ''; pwEl.focus(); btn.disabled = false;
  }
}

document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
